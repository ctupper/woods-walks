site_name: Woods Walks
site_url: https://ctupper.github.io/woods-walks/

theme:
  name: material
  palette: 
    - scheme: slate 
      primary: green
      accent: green
  features:
    - navigation.tabs 
    - navigation.sections
  mermaid: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          start_chars: '```mermaid'
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - admonition



nav:
  - Home: index.md
  - Walks: 
      - First Snow: posts/2025-12-07-first-snow.md
  - BMad Wiki:
      - Overview: bmad/overview.md
      - Flow: bmad/flow.md
      - Agents: bmad/agents.md
      - Building: bmad/build-step-by-step.md
      - Skills:
          - Spec: bmad/spec-skill.md
          - PRD: bmad/prd-skill.md
          - Architecture: bmad/architecture-skill.md
          - UX: bmad/ux-skill.md
          - Ideation: bmad/ideation-skills.md
      - Lab:
          - Logs: bmad/lab-log.md
          - Systemic Findings: bmad/systemic-findings.md
      - Reference:
          - Glossary: bmad/glossary.md

plugins:
  - search
