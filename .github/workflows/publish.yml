name: publish-docs
on:
  push:
    branches:
      - main

permissions:
  contents: write

# The wiki auto-sync can push several commits a minute apart. Only the newest
# run should publish, or a slower run of an older commit could finish last
# and overwrite gh-pages with stale content.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force