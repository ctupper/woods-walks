name: publish-docs
on:
  push:
    branches:
      - main
  # Lets you redeploy from the Actions tab without a new commit
  # (e.g. right after switching Settings > Pages > Source to "GitHub Actions").
  workflow_dispatch:

# Publishes through GitHub Pages' own deploy actions instead of pushing a
# gh-pages branch, so GitHub's built-in "pages-build-deployment" workflow
# (and its Node 20 deprecation warning) no longer runs.
# Requires Settings > Pages > Source = "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# The wiki auto-sync can push several commits a minute apart. Queue runs
# instead of running them side by side; GitHub keeps only the newest
# pending run, and a deploy that has started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
