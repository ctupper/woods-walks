name: publish-docs
on:
  push:
    branches:
      - main

permissions:
  contents: write

# The wiki auto-sync can push several commits a minute apart. Only the newest
# run should publish, or a slower run of an older commit could finish last
# and overwrite gh-pages with stale content.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      # gh-pages has a repository rule that blocks force-pushes, and
      # `gh-deploy --force` force-pushes. Fetch the current gh-pages tip so
      # gh-deploy commits on top of it and the push is a plain fast-forward
      # (checkout only fetches main). The concurrency group above keeps two
      # runs from racing for the same tip.
      - run: git fetch --depth 1 origin gh-pages:gh-pages
      - run: mkdocs gh-deploy